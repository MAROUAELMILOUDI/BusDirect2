<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-[#F3F6FF] min-h-screen flex flex-col">
    <header class="bg-white">
        <div class="border-b border-[#E1E8F5]">
            <div class="mx-auto grid grid-cols-2 max-w-6xl items-center gap-3 px-6 py-3">
                <img src="img/busdirect-logo.svg" alt="BusDirect" class="h-10 w-auto"> 
                <div class="justify-self-end">
                    <span class="rounded-full bg-[#E8EEFF] px-3 py-1 text-xs font-semibold text-[#1D4BFF]">
                        Trajets
                    </span>
                </div>
            </div> 
        </div>
    </header>
    <main class="mx-auto flex w-full max-w-6xl flex-col gap-6 px-4 py-6 sm:px-6 flex-1">
        <section class="w-full">
            <div class="pageIntroduction py-3">
                <p class="text-lg font-bold text-[#1D4BFF]">Trajets</p>
                <p class="text-sm text-gray-500">Retrouver les departs du réseau et gérez vos cabines en un coup d'oeil.</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white rounded-xl p-4 shadow flex items-center gap-3">
                    <div>
                        <p class="text-xs text-gray-500">Recette totale du réseau</p>
                        <p id="prix-Total" class="text-xl font-bold">12 450 DH</p>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-4 shadow flex items-center gap-3">
                    <div>
                        <p class="text-xs text-gray-500">Passagers du réseau</p>
                        <p id="totalRevenue" class="text-xl font-bold">86</p>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 bg-white rounded-xl p-4 shadow gap-4 mt-3">
                <div class="search relative w-full flex items-center">
                    <input type="text" id="ville" placeholder="Recherch par ville..." class="bg-gray-100 w-full text-sm sm:text-base p-2.5 pr-10 rounded-lg outline-none shadow">
                    <span class="absolute right-3 flex items-center pointer-events-none text-gray-500">
                        <i class="fa fa-search"></i>
                    </span>
                </div>
                <div class="flex flex-col gap-1 w-full">
                    <label for="statuts" class="text-sm font-medium">Statut</label>
                    <select name="statut" id="statut" class="bg-gray-100 w-full text-sm sm:text-base p-2.5 rounded-lg outline-none shadow">
                        <option value="tout">Tout</option>
                        <option value="disponible">Disponible</option>
                        <option value="complet">Complet</option>
                    </select>
                </div>
            </div>
        </section>
        <section class="w-full">
            <div id="trajets" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full"></div>
            <div id="pagination" class="flex items-center justify-center gap-2 mt-6"></div>
        </section>
    </main>   
    <footer class="text-xs text-center py-4 text-gray-500">
        BusDirect - A seat for every journey.
    </footer>
    <script type="module" src="./js/store.js"></script>
    <script type="module" src="./js/main-trajets.js"></script>
    <script type="module" src="./js/render.js"></script>
</body>
</html>
