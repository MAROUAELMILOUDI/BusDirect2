  <text x="162" y="118" font-family="'Poppins','Montserrat','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#0F1B3D">Bus</tspan><tspan fill="#1B4DFF">Direct</tspan>
