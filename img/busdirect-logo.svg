<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 200" role="img" aria-label="BusDirect logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Badge -->
  <rect x="20" y="40" width="120" height="120" rx="28" fill="#1B4DFF"/>
  <!-- Bus body -->
  <rect x="38" y="66" width="84" height="54" rx="11" fill="#FFFFFF"/>
  <!-- Windows -->
  <rect x="47" y="76" width="17" height="17" rx="3" fill="#1B4DFF"/>
  <rect x="69" y="76" width="17" height="17" rx="3" fill="#1B4DFF"/>
  <rect x="91" y="76" width="22" height="17" rx="3" fill="#1B4DFF"/>
  <!-- Wheels -->
  <circle cx="62" cy="121" r="9" fill="#FFC83D" stroke="#1B4DFF" stroke-width="3"/>
  <circle cx="100" cy="121" r="9" fill="#FFC83D" stroke="#1B4DFF" stroke-width="3"/>
  <!-- Direct arrow -->
  <path d="M40 146 H118" stroke="#FFC83D" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M107 136 L119 146 L107 156" stroke="#FFC83D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
